<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Design App Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    /* ОБЩИЕ СТИЛИ (НЕЙТРАЛЬНЫЙ ТЕМНЫЙ + РОЗОВЫЕ АКЦЕНТЫ) */
    body {
      background-color: #0b0c0e;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app-container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px 15px;
      padding-bottom: 105px; /* Запас снизу, чтобы контент не перекрывался меню */
      position: relative;
    }

    /* ВИДЖЕТ С ВЫГЛЯДЫВАЮЩИМ CSS-КОТИКОМ (ИСПРАВЛЕНО ПЕРЕКРЫТИЕ КНОПОК) */
    .cat-welcome-container {
      position: relative;
      margin-top: 15px;
      margin-bottom: 30px;
      padding-left: 80px; 
      min-height: 100px;
      height: auto;
      display: flex;
      align-items: center;
      z-index: 1; /* Оставляем шапку на нижнем слое */
    }

    /* Контейнер котика */
    .css-cat {
      position: absolute;
      left: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 90px;
      z-index: 10;
      pointer-events: none; /* Клики проходят насквозь декоративного кота */
    }

    /* Тело котика */
    .cat-body {
      position: absolute;
      bottom: 0;
      left: 10px;
      width: 50px;
      height: 65px;
      background: linear-gradient(135deg, #6e5242 25%, #423127 25%, #423127 50%, #6e5242 50%, #6e5242 75%, #423127 75%);
      background-size: 20px 20px;
      border-radius: 25px 25px 15px 15px;
      box-shadow: inset -5px -5px 0px rgba(0,0,0,0.2);
    }

    /* Грудка котика */
    .cat-breast {
      position: absolute;
      bottom: 0;
      left: 15px;
      width: 30px;
      height: 35px;
      background: #fcfaf2;
      border-radius: 50% 50% 30% 30%;
    }

    /* Голова котика */
    .cat-head {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 55px;
      height: 48px;
      background: linear-gradient(to bottom, #6e5242, #543d31);
      border-radius: 50%;
    }

    /* Мордочка и щечки */
    .cat-muzzle {
      position: absolute;
      bottom: 6px;
      left: 12px;
      width: 30px;
      height: 18px;
      background: #fcfaf2;
      border-radius: 10px;
    }
    .cat-nose {
      position: absolute;
      top: 2px;
      left: 12px;
      width: 6px;
      height: 4px;
      background: #ff94b8;
      border-radius: 50%;
    }

    /* Глазки */
    .cat-eye {
      position: absolute;
      top: 15px;
      width: 9px;
      height: 9px;
      background: #241c18;
      border-radius: 50%;
    }
    .cat-eye.left { left: 10px; }
    .cat-eye.right { right: 10px; }
    .cat-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }

    /* Пушистые ушки */
    .cat-ear {
      position: absolute;
      top: -10px;
      width: 20px;
      height: 22px;
      background: #423127;
      border-radius: 30% 70% 30% 30%;
    }
    .cat-ear.left {
      left: 2px;
      transform: rotate(-15deg);
    }
    .cat-ear.right {
      right: 2px;
      transform: rotate(15deg) scaleX(-1);
    }
    .cat-ear::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 10px;
      height: 12px;
      background: #ffb5cc;
      border-radius: 30% 70% 30% 30%;
    }

    /* Лапка, которая машет */
    .cat-paw-waving {
      position: absolute;
      top: -12px;
      right: -8px;
      width: 18px;
      height: 32px;
      background: #6e5242;
      border-radius: 10px;
      transform-origin: bottom center;
      animation: catWave 1.8s ease-in-out infinite;
      box-shadow: -1px 2px 5px rgba(0,0,0,0.2);
    }
    .cat-paw-waving::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 18px;
      height: 12px;
      background: #fcfaf2;
      border-radius: 8px 8px 4px 4px;
    }

    @keyframes catWave {
      0%, 100% { transform: rotate(0deg); }
      33% { transform: rotate(-25deg); }
      66% { transform: rotate(10deg); }
    }

    /* Табличка приветствия */
    .cat-signboard {
      background: linear-gradient(135deg, #141619, #1c1f24);
      border: 1px solid rgba(255, 0, 127, 0.25);
      border-radius: 16px;
      padding: 14px 16px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 0, 127, 0.05);
      position: relative;
      box-sizing: border-box;
    }

    .cat-signboard::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #141619;
      border-left: 1px solid rgba(255, 0, 127, 0.25);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
    }

    .cat-signboard h4 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .cat-signboard p {
      margin: 5px 0 0 0;
      font-size: 12px;
      color: #ff66cc;
      font-weight: 600;
      line-height: 1.4;
      text-shadow: 0 0 8px rgba(255, 102, 204, 0.2);
    }

    /* АНИМАЦИИ И ГРАДИЕНТЫ ТЕКСТА */
    @keyframes gradientMovement {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }
    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title, .gradient-text {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-top: 5px;
      margin-bottom: 25px;
      background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMovement 6s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* СПИСОК ТАРИФОВ (ПРИНУДИТЕЛЬНО ПОВЕРХ ШАПКИ) */
    .tariffs-list, .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 25px;
      position: relative;
      z-index: 15; /* Поднимаем тарифы выше кошачьего контейнера */
    }

    .tariff-wrapper, .review-item-wrapper {
      position: relative;
      padding: 2px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.03);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
    }

    .tariff-wrapper:hover, .review-item-wrapper:hover {
      background: linear-gradient(-45deg, rgba(255, 0, 127, 0.3), rgba(112, 0, 255, 0.3));
      box-shadow: 0 6px 20px rgba(255, 0, 127, 0.08);
      transform: translateY(-2px);
    }

    .tariff-wrapper.selected {
      background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f);
      background-size: 300% 300%;
      animation: gradientMovement 4s ease infinite;
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
      transform: translateY(-2px);
    }

    .tariff-card, .review-item {
      background: #141619; 
      border-radius: 16px;
      padding: 16px 18px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .tariff-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .tariff-info {
      display: flex;
      flex-direction: column;
      gap: 5px;
      max-width: 75%;
    }

    .tariff-name, .reviewer-name {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tariff-name .fa-seedling { color: #ff66cc; }
    .tariff-name .fa-bolt { color: #ffcc00; }
    .tariff-name .fa-crown { color: #ff3b57; }

    .tariff-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    .tariff-price {
      text-align: right;
    }

    .price-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
    }

    .price-value {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      transition: color 0.3s ease;
    }
    
    .tariff-wrapper.selected .price-value {
      color: #ff66cc;
      text-shadow: 0 0 10px rgba(255, 102, 204, 0.3);
    }

    /* ФОРМА ЗАКАЗА */
    .form-group {
      margin-bottom: 20px;
      position: relative;
      z-index: 15;
    }

    .form-group label, .reviews-section h3 {
      display: block;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .reviews-section h3 {
      font-size: 15px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-control {
      width: 100%;
      background: #141619;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 16px;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .form-control:focus {
      border-color: #ff007f;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.1);
    }

    /* КНОПКИ С АНИМАЦИЕЙ */
    .submit-btn-wrapper, .btn-animate {
      position: relative;
      padding: 2px;
      border-radius: 16px;
      background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f);
      background-size: 300% 300%;
      animation: gradientMovement 5s ease infinite;
      cursor: pointer;
      display: block;
      text-decoration: none;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
      z-index: 15;
    }

    .submit-btn-wrapper button, .btn-animate span {
      width: 100%;
      background: #141619;
      color: #ff66cc;
      border: none;
      border-radius: 14px;
      padding: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
      display: block;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .submit-btn-wrapper:hover, .btn-animate:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 8px 25px rgba(255, 0, 127, 0.25);
    }

    .submit-btn-wrapper:hover button, .btn-animate:hover span {
      background: transparent;
      color: #ffffff;
    }

    /* ОТЗЫВЫ (СТРАНИЦА ИНФОРМАЦИИ) */
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stars {
      letter-spacing: 2px;
      font-size: 11px;
      color: #ffcc00;
    }

    .review-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s cubic-bezier(0, 1, 0, 1), padding 0.3s ease;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
      padding: 0;
    }

    .review-item-wrapper.expanded .review-content {
      max-height: 200px;
      padding-top: 12px;
      transition: max-height 0.3s ease-in-out, padding 0.3s ease;
    }

    .coop-card, .info-footer {
      background: #141619;
      border-radius: 18px;
      padding: 20px;
      margin-top: 25px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .coop-badge {
      color: #ff66cc;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .coop-text, .info-footer p {
      color: #94a3b8;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .info-footer {
      text-align: center;
      margin-top: 20px;
    }

    .info-footer p {
      margin: 0 0 16px 0;
    }

    /* НИЖНЕЕ МЕНЮ НАВИГАЦИИ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
