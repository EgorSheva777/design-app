<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f1014, #1a1b26);
            color: white; font-family: sans-serif; margin: 0; padding: 20px;
            min-height: 100vh; animation: bgShift 10s infinite alternate;
        }
        @keyframes bgShift { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(30deg); } }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 20px; margin-bottom: 15px;
            position: relative; overflow: hidden;
        }
        .card::after {
            content: "🐱"; position: absolute; right: 10px; top: 10px; font-size: 24px; opacity: 0.5;
        }
        h2 { text-align: center; color: #ff2d55; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔮 Тарифы</h2>
        <p>Выберите стиль для проекта</p>
    </div>
    <div class="card">
        <h2>✨ Информация</h2>
        <p>Наши котики-дизайнеры ждут ТЗ!</p>
    </div>
    <script>window.Telegram.WebApp.expand();</script>
</body>
</html>
