<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design Studio</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #131419; color: #ffffff;
            margin: 0; padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 400px; margin: 0 auto; position: relative; }
        .tariff-card {
            background: #1c1d24; border: 2px solid transparent;
            border-radius: 16px; padding: 16px; margin-bottom: 18px;
            cursor: pointer; position: relative;
        }
        .tariff-card.selected { border-color: #ff2d55; }
        .submit-btn {
            background: #ff2d55; color: white; border: none;
            border-radius: 12px; padding: 14px; width: 100%; font-weight: bold;
        }
        /* Кошечка */
        .cat-anim {
            position: absolute; font-size: 24px;
            animation: catRun 10s linear infinite;
            z-index: 100; pointer-events: none;
        }
        @keyframes catRun {
            0% { top: 0; left: 0; }
            25% { top: 0; left: 85%; }
            50% { top: 600px; left: 85%; }
            75% { top: 600px; left: 0; }
            100% { top: 0; left: 0; }
        }
    </style>
</head>
<body>
    <div class="cat-anim">🐱</div>
    <div class="container">
        <h2>🔮 Выберите тариф</h2>
        <div class="tariff-card selected"><h3>🌱 Бюджетный</h3><p>Дёшево, стильно, свежо.</p><b>от 590₽</b></div>
        <div class="tariff-card"><h3>⚡ Средний</h3><p>Отличный вкус, баланс цены.</p><b>от 1090₽</b></div>
        <div class="tariff-card"><h3>👑 Профи</h3><p>Результат без компромиссов.</p><b>от 1590₽</b></div>
        <button class="submit-btn" onclick="Telegram.WebApp.close()">Подтвердить заказ</button>
    </div>
    <script>window.Telegram.WebApp.expand();</script>
</body>
</html>
