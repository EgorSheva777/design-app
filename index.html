<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design Studio App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #131419;
            color: #ffffff;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #f5f5f7;
        }

        /* Карточки тарифов */
        .tariff-card {
            background-color: #1c1d24;
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        /* Стиль для выбранной карточки */
        .tariff-card.selected {
            border-color: #ff2d55;
            background-color: #221a24;
        }

        .tariff-info h3 {
            margin: 0 0 6px 0;
            font-size: 18px;
        }

        .tariff-info p {
            margin: 0;
            font-size: 13px;
            color: #a1a1a6;
            line-height: 1.4;
        }

        .tariff-price {
            font-size: 20px;
            font-weight: bold;
            color: #00eaab;
            white-space: nowrap;
            margin-left: 12px;
        }

        /* Поля ввода */
        .form-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
        }
