<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Design App Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <style>
    body {
      background-color: #0b0c0e;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .app-container {
      max-width: 450px;
      margin: 0 auto;
      padding: 20px 15px;
      padding-bottom: 95px;
    }

    /* КОТИК НА ПЕРВОЙ СТРАНИЦЕ */
    .cat-welcome-container {
      position: relative;
      margin-top: 15px;
      margin-bottom: 30px;
      padding-left: 80px; 
      min-height: 100px;
      display: flex;
      align-items: center;
    }

    .css-cat {
      position: absolute;
      left: -5px;
      top: 50%;
      transform: translateY(-50%);
      width: 70px;
      height: 90px;
      z-index: 10;
    }

    .cat-body {
      position: absolute;
      bottom: 0;
      left: 10px;
      width: 50px;
      height: 65px;
      background: linear-gradient(135deg, #6e5242 25%, #423127 25%, #423127 50%, #6e5242 50%, #6e5242 75%, #423127 75%);
      background-size: 20px 20px;
      border-radius: 25px 25px 15px 15px;
      box-shadow: inset -5px -5px 0px rgba(0,0,0,0.2);
    }

    .cat-breast {
      position: absolute;
      bottom: 0;
      left: 15px;
      width: 30px;
      height: 35px;
      background: #fcfaf2;
      border-radius: 50% 50% 30% 30%;
    }

    .cat-head {
      position: absolute;
      top: 5px;
      left: 5px;
      width: 55px;
      height: 48px;
      background: linear-gradient(to bottom, #6e5242, #543d31);
      border-radius: 50%;
    }

    .cat-muzzle {
      position: absolute;
      bottom: 6px;
      left: 12px;
      width: 30px;
      height: 18px;
      background: #fcfaf2;
      border-radius: 10px;
    }
    .cat-nose {
      position: absolute;
      top: 2px;
      left: 12px;
      width: 6px;
      height: 4px;
      background: #ff94b8;
      border-radius: 50%;
    }

    .cat-eye {
      position: absolute;
      top: 15px;
      width: 9px;
      height: 9px;
      background: #241c18;
      border-radius: 50%;
    }
    .cat-eye.left { left: 10px; }
    .cat-eye.right { right: 10px; }
    .cat-eye::after {
      content: '';
      position: absolute;
      top: 1px;
      left: 1px;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
    }

    .cat-ear {
      position: absolute;
      top: -10px;
      width: 20px;
      height: 22px;
      background: #423127;
      border-radius: 30% 70% 30% 30%;
    }
    .cat-ear.left { left: 2px; transform: rotate(-15deg); }
    .cat-ear.right { right: 2px; transform: rotate(15deg) scaleX(-1); }
    .cat-ear::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      width: 10px;
      height: 12px;
      background: #ffb5cc;
      border-radius: 30% 70% 30% 30%;
    }

    .cat-paw-waving {
      position: absolute;
      top: -12px;
      right: -8px;
      width: 18px;
      height: 32px;
      background: #6e5242;
      border-radius: 10px;
      transform-origin: bottom center;
      animation: catWave 1.8s ease-in-out infinite;
      box-shadow: -1px 2px 5px rgba(0,0,0,0.2);
    }
    .cat-paw-waving::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 18px;
      height: 12px;
      background: #fcfaf2;
      border-radius: 8px 8px 4px 4px;
    }

    @keyframes catWave {
      0%, 100% { transform: rotate(0deg); }
      33% { transform: rotate(-25deg); }
      66% { transform: rotate(10deg); }
    }

    .cat-signboard {
      background: linear-gradient(135deg, #141619, #1c1f24);
      border: 1px solid rgba(255, 0, 127, 0.25);
      border-radius: 16px;
      padding: 14px 16px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(255, 0, 127, 0.05);
      position: relative;
    }

    .cat-signboard::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 50%;
      transform: translateY(-50%) rotate(45deg);
      width: 12px;
      height: 12px;
      background: #141619;
      border-left: 1px solid rgba(255, 0, 127, 0.25);
      border-bottom: 1px solid rgba(255, 0, 127, 0.25);
    }

    .cat-signboard h4 { margin: 0; font-size: 15px; font-weight: 700; color: #ffffff; }
    .cat-signboard p { margin: 5px 0 0 0; font-size: 12px; color: #ff66cc; font-weight: 600; line-height: 1.4; text-shadow: 0 0 8px rgba(255, 102, 204, 0.2); }

    @keyframes gradientMovement {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.4s ease-out;
    }
    .tab-content.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title, .gradient-text {
      text-align: center;
      font-size: 24px;
      font-weight: 800;
      margin-top: 5px;
      margin-bottom: 25px;
      background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMovement 6s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    /* ТАРИФЫ И ОТЗЫВЫ */
    .tariffs-list, .reviews-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 25px; }
    .tariff-wrapper, .review-item-wrapper { position: relative; padding: 2px; border-radius: 18px; background: rgba(255, 255, 255, 0.03); transition: transform 0.3s ease, box-shadow 0.3s ease; }
    .tariff-wrapper.selected { background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f); background-size: 300% 300%; animation: gradientMovement 4s ease infinite; box-shadow: 0 0 25px rgba(255, 0, 127, 0.2); }
    .tariff-card, .review-item { background: #141619; border-radius: 16px; padding: 16px 18px; cursor: pointer; }
    .tariff-card { display: flex; justify-content: space-between; align-items: center; }
    .tariff-info { display: flex; flex-direction: column; gap: 5px; max-width: 75%; }
    .tariff-name, .reviewer-name { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .tariff-name .fa-seedling { color: #ff66cc; }
    .tariff-name .fa-bolt { color: #ffcc00; }
    .tariff-name .fa-crown { color: #ff3b57; }
    .tariff-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .tariff-price { text-align: right; }
    .price-label { font-size: 10px; color: #64748b; text-transform: uppercase; display: block; }
    .price-value { font-size: 18px; font-weight: 800; color: #ffffff; }
    .tariff-wrapper.selected .price-value { color: #ff66cc; text-shadow: 0 0 10px rgba(255, 102, 204, 0.3); }

    .form-group { margin-bottom: 20px; }
    .form-group label, .reviews-section h3 { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 8px; font-weight: 500; }
    .reviews-section h3 { font-size: 15px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }

    .form-control { width: 100%; background: #141619; border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 16px; color: #ffffff; font-size: 14px; box-sizing: border-box; outline: none; }

    .submit-btn-wrapper, .btn-animate { position: relative; padding: 2px; border-radius: 16px; background: linear-gradient(-45deg, #ff007f, #ff66cc, #7000ff, #ff007f); background-size: 300% 300%; animation: gradientMovement 5s ease infinite; cursor: pointer; }
    .submit-btn-wrapper button, .btn-animate span { width: 100%; background: #141619; color: #ff66cc; border: none; border-radius: 14px; padding: 16px; font-size: 15px; font-weight: 700; text-align: center; box-sizing: border-box; display: block; }

    .review-header { display: flex; justify-content: space-between; align-items: center; }
    .stars { letter-spacing: 2px; font-size: 11px; color: #ffcc00; }
    .review-content { max-height: 0; overflow: hidden; transition: max-height 0.3s ease, padding 0.3s ease; font-size: 13px; color: #94a3b8; line-height: 1.5; padding: 0; }
    .review-item-wrapper.expanded .review-content { max-height: 200px; padding-top: 12px; }

    .coop-card, .info-footer { background: #141619; border-radius: 18px; padding: 20px; margin-top: 25px; border: 1px solid rgba(255, 255, 255, 0.03); }
    .coop-badge { color: #ff66cc; font-weight: 600; font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .coop-text, .info-footer p { color: #94a3b8; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
    .info-footer { text-align: center; margin-top: 20px; }
    .info-footer p { margin: 0 0 16px 0; }

    /* НАВИГАЦИЯ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 450px;
      background: #0d0e10;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.03);
      z-index: 1000;
    }

    .nav-item { background: none; border: none; color: #64748b; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; flex: 1; }
    .nav-item i { font-size: 18px; }
    .nav-item.active { color: #ff66cc; text-shadow: 0 0 10px rgba(255, 102, 204, 0.2); }

    /* СТИЛИ ДЛЯ ОБНОВЛЕННОЙ АРКАДНОЙ ИГРЫ */
    .game-card {
      background: #141619;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255, 255, 255, 0.02);
      margin-top: 5px;
    }

    /* Игровой экран */
    .game-viewport {
      position: relative;
      width: 100%;
      height: 320px;
      background: linear-gradient(180deg, #0f1115, #161920);
      border-radius: 18px;
      overflow: hidden;
      border: 2px solid rgba(255, 102, 204, 0.15);
      margin-bottom: 15px;
    }

    /* Падающие элементы */
    .falling-item {
      position: absolute;
      font-size: 26px;
      user-select: none;
      will-change: top;
    }

    /* Персонаж котика в игре */
    .game-player-cat {
      position: absolute;
      bottom: 10px;
      left: 50%;
      width: 60px;
      height: 50px;
      background: #6e5242;
      border-radius: 20px 20px 10px 10px;
      transform: translateX(-50%);
      transition: left 0.1s ease-out;
    }

      content: '';
      position: absolute;
      top: -8px;
      width:
