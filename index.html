<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design Studio App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1e1f26, #131419);
            color: #ffffff;
        }
        .container { width: 100%; max-width: 400px; margin: 0 auto; }
        .tariff-card {
            background: rgba(28, 29, 36, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
        }
        h2 { text-align: center; color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔮 Выберите тариф</h2>
        <div class="tariff-card">
            <div><h3>🌱 Бюджетный</h3><p>Дёшево, стильно, свежо.</p></div>
            <div style="font-size: 20px; font-weight: bold; color: #00eaab;">от 590₽</div>
        </div>
    </div>
    <script>window.Telegram.WebApp.expand();</script>
</body>
</html>
