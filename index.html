<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Design Studio App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Минималистичный динамичный фон */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px 16px 90px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 0%, #1e1f26, #131419);
            color: #ffffff;
            overflow-x: hidden;
        }

        .container { width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 24px; color: #ffffff; }
        
        .page { display: none; }
        .page.active { display: block; }

        .tariff-card {
            background-color: rgba(28, 29, 36, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .tariff-card.selected {
            background-color: rgba(30, 32, 42, 0.9);
            border-color: #ff2d55;
            box-shadow: 0 4px 15px rgba(255, 45, 85, 0.2);
        }

        .tariff-price { font-size: 20px; font-weight: bold; color: #00eaab; }
        
        .submit-btn {
            background-color: #ff2d55; color: #ffffff; border: none; border-radius: 12px;
            padding: 14px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 24px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 65px;
            background-color: rgba(28, 29, 36, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-around; align-items: center; z-index: 999;
        }
        .nav-item { color: #7a7a85; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-item.active { color: #ff2d55; }
    </style>
</head>
<body>
    <div class="container">
        <div id="orderPage" class="page active">
            <h2>🔮 Выберите тариф</h2>
            <div class="tariff-card selected">
                <div><h3>🌱 Бюджетный</h3><p>Дёшево, стильно, свежо.</p></div>
                <div class="tariff-price">от 590₽</div>
            </div>
            <button class="submit-btn">Подтвердить заказ</button>
        </div>
        <div id="infoPage" class="page">
            <h2>✨ Информация</h2>
            <p style="text-align:center;">Здесь будет ваш контент.</p>
        </div>
    </div>
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchPage('order')"><span>Заказ</span></div>
        <div class="nav-item" onclick="switchPage('info')"><span>Инфо</span></div>
    </div>
    <script>
        window.Telegram.WebApp.expand();
        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page + 'Page').classList.add('active');
        }
    </script>
</body>
</html>
